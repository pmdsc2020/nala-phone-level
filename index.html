<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C63A1F">
<title>Nala Phone Level</title>
<meta name="description" content="Quick planning survey of nala cross sections and L-sections using the phone tilt sensor, a tape and two poles.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column field book (max 640px), sticky header with a ranging-rod stripe, big touch targets for use in sun */
:root{
  --paper:#EEF2F1; --card:#FFFFFF; --ink:#16232B; --ink-2:#51616B; --rule:#CCD5D8; --soft:#E3E9E9;
  --rod:#C63A1F; --rod-ink:#FFFFFF;
  --water:#2C78B0; --water-fill:rgba(44,120,176,.20);
  --earth:#86643D; --earth-fill:rgba(134,100,61,.17);
  --ok:#21794A; --warn:#A86A0C; --bad:#B42318;
  --ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1519; --card:#172027; --ink:#E4EBEE; --ink-2:#97A7B0; --rule:#2B3841; --soft:#1F2A31;
    --rod:#EE5B3A; --rod-ink:#FFFFFF;
    --water:#5BA6DC; --water-fill:rgba(91,166,220,.22);
    --earth:#C99B68; --earth-fill:rgba(201,155,104,.16);
    --ok:#4CC27F; --warn:#E0A43A; --bad:#F06C5E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1519; --card:#172027; --ink:#E4EBEE; --ink-2:#97A7B0; --rule:#2B3841; --soft:#1F2A31;
  --rod:#EE5B3A; --rod-ink:#FFFFFF;
  --water:#5BA6DC; --water-fill:rgba(91,166,220,.22);
  --earth:#C99B68; --earth-fill:rgba(201,155,104,.16);
  --ok:#4CC27F; --warn:#E0A43A; --bad:#F06C5E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font:16px/1.42 var(--ui);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:58px}
.bar h1{font-size:20px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.bar .sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.bar .tt{min-width:0;flex:1}
.bar .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:44px;height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rod{height:6px;background:repeating-linear-gradient(90deg,var(--rod) 0 26px,var(--card) 26px 52px)}

main{max-width:640px;margin:0 auto;padding:16px 16px 110px;display:grid;gap:16px}
main>*{min-width:0}
h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 -6px;font-weight:600}
p{margin:0}
.lede{font-size:17px;max-width:62ch}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 140px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.btn{min-height:48px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--rod);border-color:var(--rod);color:var(--rod-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px}
.btn[disabled]{opacity:.45;pointer-events:none}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;min-height:60px}
.item b{font-size:17px}
.item .meta{grid-column:1;font-size:14px;color:var(--ink-2)}
.item .go{grid-row:1/span 2;grid-column:2;color:var(--ink-2);font-size:22px}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--ink-2);vertical-align:2px}
.tag.rod{background:var(--rod);color:var(--rod-ink)}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}

.note{border-left:4px solid var(--warn);background:var(--card);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.note.bad{border-color:var(--bad)}
.note.ok{border-color:var(--ok)}

/* key figures */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--card)}
.kpi{padding:12px 14px;border-bottom:1px solid var(--rule);min-width:0}
.kpi:nth-child(odd){border-right:1px solid var(--rule)}
.kpi:nth-last-child(-n+2):nth-child(odd),.kpi:last-child{border-bottom:0}
.kpi .k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.15;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:400;color:var(--ink-2)}
.kpi.lead .v{color:var(--rod)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:340px}
.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:8px 8px;border-bottom:1px solid var(--rule);font-weight:600;white-space:nowrap}
.t td{padding:10px 8px;border-bottom:1px solid var(--soft);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;font-family:var(--ui);white-space:normal}
.t tr:last-child td{border-bottom:0}
.t tr[data-a]{cursor:pointer}
.t tr[data-a]:active td{background:var(--soft)}
.t td .pm{color:var(--ink-2);font-size:12px}

/* forms */
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:13px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:17px}
.fld textarea{min-height:70px;resize:vertical}
.fld input.mono{font-family:var(--mono)}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;font-weight:600;font-size:15px;padding:0 8px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--rule);background:var(--paper);font-weight:500;font-size:15px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-size:16px}
.check input{width:22px;height:22px;accent-color:var(--rod)}

.angbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:var(--r);padding:12px;background:var(--paper)}
.angbox .big{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1}
.angbox .sm{font-size:13px;color:var(--ink-2);margin-top:4px}
.preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.preview div{background:var(--paper);border-radius:8px;padding:8px 4px}
.preview .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.preview .v{font-family:var(--mono);font-weight:600;font-size:17px}

.plot{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:6px 4px 2px;overflow:hidden}
.plot svg{display:block;width:100%;height:auto}
.plotcap{font-size:13px;color:var(--ink-2);padding:0 8px 6px}

.setup{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:10px 12px}
.setup svg{flex:none;width:22px;height:26px}
.setup .tx{flex:1;min-width:0;font-size:15px}
.setup select{max-width:48%;min-height:40px;border-radius:8px;border:0;padding:0 8px;background:var(--paper);color:var(--ink);font-size:15px}

.foot{font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:12px;margin-top:8px}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}
.steps li{padding-left:4px}
.acc td:nth-child(2),.acc td:nth-child(3){text-align:right}

/* sight overlay: single dark look on purpose (camera view) */
#sight{position:fixed;inset:0;z-index:50;background:#05090B;color:#F3F6F7;display:flex;flex-direction:column;overscroll-behavior:contain}
#sight .view{position:relative;flex:1;overflow:hidden;min-height:0}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#nocam{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:17px;color:#C9D3D8;line-height:1.5}
.xh{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.xh i{position:absolute;background:#FF3B1F;box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.xh .h{left:-46vw;width:92vw;top:-1px;height:2px}
.xh .v{top:-30vh;height:60vh;left:-1px;width:2px}
.xh b{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border:2px solid #FF3B1F;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.s-top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;gap:8px;align-items:flex-start;background:linear-gradient(#05090Bdd,#05090B00)}
.s-top .hint{flex:1;font-size:15px;font-weight:600}
.s-top button{min-height:38px;border-radius:8px;border:1px solid #6B7A82;background:#0E161Acc;color:#F3F6F7;padding:0 10px;font-size:14px;font-weight:600}
.s-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.s-zoom button{width:46px;height:40px;border-radius:8px;border:1px solid #6B7A82;background:#0E161Acc;color:#F3F6F7;font-weight:700}
.s-zoom button.on{background:#F3F6F7;color:#05090B}
.s-bot{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:#0B1215;display:grid;gap:10px;border-top:3px solid #FF3B1F}
.s-ang{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
#sAng{font-family:var(--mono);font-size:46px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
#sRaw{font-family:var(--mono);font-size:12px;color:#9FB0B8}
.stab{height:8px;border-radius:4px;background:#26323A;overflow:hidden}
.stab i{display:block;height:100%;width:0;background:#4CC27F;transition:width .15s}
.stabtx{font-size:13px;color:#9FB0B8;display:flex;justify-content:space-between;gap:8px}
#sMsg{font-size:14px;color:#F3B25E}
.s-act{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.s-act button{min-height:56px;border-radius:10px;font-size:18px;font-weight:700;border:1px solid #6B7A82;background:transparent;color:#F3F6F7}
.s-act .read{background:#FF3B1F;border-color:#FF3B1F;color:#fff}
#sRes{display:grid;gap:8px;background:#16222A;border-radius:10px;padding:12px}
#sRes .big{font-family:var(--mono);font-size:30px;font-weight:600}

/* GPS sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:3px solid var(--water);padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
#sheet .in{max-width:640px;margin:0 auto;display:grid;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:15px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="back" id="hBack" data-a="back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tt"><h1 id="hTitle">Nala Phone Level</h1><div class="sub" id="hSub"></div></div>
  </div>
  <div class="rod"></div>
</header>
<main id="app"></main>

<div id="sight" hidden>
  <div class="view">
    <video id="cam" playsinline muted autoplay></video>
    <div id="nocam" hidden></div>
    <div class="xh" id="xh"><i class="h"></i><i class="v"></i><b></b></div>
    <div class="s-top"><div class="hint" id="sHint"></div><button id="sMode" data-a="s-mode">Top edge</button></div>
    <div class="s-zoom" id="sZoom"><button data-a="zoom" data-z="1" class="on">1×</button><button data-a="zoom" data-z="2">2×</button><button data-a="zoom" data-z="4">4×</button></div>
  </div>
  <div class="s-bot">
    <div class="s-ang"><span id="sAng">--.--°</span><span id="sRaw"></span></div>
    <div class="stab"><i id="sStab"></i></div>
    <div class="stabtx"><span id="sStabTx">Waiting for tilt sensor…</span><span>steady &lt; 0.05°</span></div>
    <div id="sMsg"></div>
    <div id="sRes" hidden></div>
    <div class="s-act" id="sAct"><button data-a="s-cancel">Cancel</button><button class="read" id="sRead" data-a="s-read">Read angle</button></div>
  </div>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* Nala Phone Level — quick planning survey of nala cross sections and L-sections.
   Jitendra Sonawane, Agriculture Engineer, 7720045808 */
const KEY='nalaPhoneLevel.v1', D2R=Math.PI/180, R2D=180/Math.PI;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'–';
const clamp1=v=>Math.max(-1,Math.min(1,v));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const std=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
const fmtAng=v=>Number.isFinite(v)?(v>=0?'+':'−')+Math.abs(v).toFixed(2)+'°':'--.--°';
const cm=v=>Number.isFinite(v)?'±'+Math.max(1,Math.round(v*100))+' cm':'';
const num=v=>{const x=parseFloat(String(v).replace(',','.').replace('−','-'));return Number.isFinite(x)?x:NaN};

const CS_LABELS=['LB peg','LB top','LB toe','Bed','Deepest bed','RB toe','RB top','RB peg','HFL mark','Field','Other'];
const LS_LABELS=['Bed','Pool','Drop','Proposed site','Other'];

/* ---------- data ---------- */
function mkPt(o){return Object.assign({id:uid(),label:'Point',st:null,d:0,mode:'h',dir:1,ang:0,raw:null,cal:0,sd:null,n:0,hi:1.5,ht:1.5,gps:null,note:''},o)}
function example(){
  const s={id:uid(),example:true,village:'Example village',nala:'Sample nala',place:'Practice data. Delete it when you start real work.',surveyor:'',date:today(),notes:'',lines:[]};
  const cs=(name,ch,data)=>{const p0=mkPt({label:'LB peg',start:true});const pts=[p0];
    data.forEach(([lab,d,a])=>pts.push(mkPt({label:lab,st:p0.id,d,ang:a,raw:a,sd:0.06,n:58})));
    return {id:uid(),type:'CS',name,ch,startRL:100,tie:true,hi:1.5,setup:p0.id,gps:null,pts}};
  s.lines.push(cs('CS-1',0,[['LB top',2.0,-2.86],['LB toe',4.5,-23.0],['Bed',6.0,-19.6],['Deepest bed',8.0,-15.9],['Bed',10.0,-12.4],['RB toe',11.5,-9.6],['RB top',14.0,-1.5],['Field',17.0,-0.9]]));
  s.lines.push(cs('CS-2',50,[['LB top',1.5,-3.0],['LB toe',4.0,-26.0],['Bed',6.0,-20.5],['Deepest bed',7.5,-17.8],['Bed',9.5,-13.6],['RB toe',11.0,-10.0],['RB top',13.0,-2.5],['HFL mark',12.5,-4.8],['Field',16.0,-1.0]]));
  s.lines.push(cs('CS-3',100,[['LB top',2.0,-2.0],['LB toe',5.0,-21.0],['Bed',7.0,-18.4],['Deepest bed',9.0,-15.0],['Bed',11.0,-11.8],['RB toe',12.5,-8.8],['RB top',15.0,-0.5],['Field',18.0,-0.3]]));
  const l0=mkPt({label:'Bed',start:true});const lp=[l0];let prev=l0;
  [[25,-1.6],[25,-1.2],[25,-1.5],[25,-0.9]].forEach(([d,a])=>{const p=mkPt({label:'Bed',st:prev.id,d,ang:a,raw:a,sd:0.07,n:60});lp.push(p);prev=p});
  s.lines.push({id:uid(),type:'LS',name:'L-section',ch:0,startRL:100,tie:false,hi:1.5,setup:prev.id,gps:null,pts:lp});
  return s;
}
function fresh(){return {settings:{hi:1.5,mode:'cam',cal:{cam:0,edge:0},calDate:{cam:null,edge:null},calLog:[],sigma:0.15},surveys:[example()],stack:[{v:'home'}]}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.surveys&&o.settings)return o}}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this phone. Export a backup now.')}}
const getS=id=>S.surveys.find(x=>x.id===id);

/* ---------- survey maths ---------- */
// RL(target) = RL(instrument point) + hi + D·tanθ − ht   (horizontal tape)
// RL(target) = RL(instrument point) + hi + S·sinθ − ht   (tape along slope; D = S·cosθ)
function compute(line){
  const by={};line.pts.forEach(p=>by[p.id]=p);
  const out={};const sig0=S.settings.sigma;
  function calc(p,g){
    if(out[p.id])return out[p.id];
    if(p.start)return out[p.id]={off:0,rl:line.startRL,sig:0};
    const st=by[p.st];
    if(!st||g>400)return out[p.id]={off:NaN,rl:NaN,sig:NaN};
    const s=calc(st,g+1);const th=p.ang*D2R;
    let dh,dv;
    if(p.mode==='s'){dh=p.d*Math.cos(th);dv=p.d*Math.sin(th)}else{dh=p.d;dv=p.d*Math.tan(th)}
    const sa=Math.sqrt((p.sd||0)**2+sig0**2)*D2R;

let gps=null;
function startGps(done){
  if(!navigator.geolocation){toast('GPS is not available in this browser');return}
  const sh=$('#sheet');sh.hidden=false;
  sh.innerHTML=`<div class="in"><b>Getting GPS position</b><div class="small">Stand still with a clear view of the sky. Fixes: <b class="mono" id="gN">0</b> · best accuracy <b class="mono" id="gA">–</b> m</div><div class="small muted" id="gMsg">Waiting for the first fix…</div><div class="split"><button class="btn" data-a="gps-x">Cancel</button><button class="btn pri" data-a="gps-ok">Use position</button></div></div>`;
  const fixes=[];
  const wid=navigator.geolocation.watchPosition(p=>{fixes.push({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy});
      $('#gN').textContent=fixes.length;$('#gA').textContent=Math.round(Math.min(...fixes.map(x=>x.acc)));$('#gMsg').textContent='Keep still. It stops by itself after 20 seconds.'},
    e=>{const m=$('#gMsg');if(m)m.textContent=e.code===1?'Location permission was refused. Allow location for this page in the browser settings.':(e.message||'GPS error')},
    {enableHighAccuracy:true,maximumAge:0,timeout:30000});
  gps={wid,fixes,done,to:setTimeout(()=>stopGps(true),20000)};
}
function stopGps(use){
  if(!gps)return;const g=gps;gps=null;navigator.geolocation.clearWatch(g.wid);clearTimeout(g.to);$('#sheet').hidden=true;
  if(!use)return;
  if(!g.fixes.length){toast('No GPS fix yet. Try again in the open.');return}
  const best=Math.min(...g.fixes.map(x=>x.acc));const use2=g.fixes.filter(x=>x.acc<=Math.max(best*2,best+5));
  let w=0,la=0,lo=0;use2.forEach(x=>{const k=1/(x.acc*x.acc);w+=k;la+=x.lat*k;lo+=x.lon*k});
  g.done({lat:la/w,lon:lo/w,acc:best,n:use2.length,t:new Date().toISOString()});
}

let sightOpen=false,sOpt=null,sRes=null,stream=null,wake=null,raf=0,cap=null,zoom=1;
const sens={buf:[],got:false,abs:false};
const calNow=()=>S.settings.cal[S.settings.mode]||0;
function onOri(e){
  if(e.beta==null)return;
  if(!sens.got){sens.got=true;$('#sMsg').textContent=''}
  const b=e.beta*D2R,g=(e.gamma||0)*D2R;
  // camera looks along the phone's −z axis; top edge looks along +y
  const el=(S.settings.mode==='cam'?Math.asin(clamp1(-Math.cos(b)*Math.cos(g))):Math.asin(clamp1(Math.sin(b))))*R2D;
  const t=performance.now();sens.buf.push({t,v:el});while(sens.buf.length&&t-sens.buf[0].t>3000)sens.buf.shift();
  if(cap&&cap.rec)cap.buf.push(el);
}
async function openSight(opt){
  sOpt=opt;sRes=null;sightOpen=true;cap=null;
  history.pushState({sight:1},'');pushed++;
  $('#sight').hidden=false;document.body.classList.add('noscroll');
  $('#sHint').textContent=opt.hint||'';$('#sRes').hidden=true;$('#sAct').hidden=false;$('#sRead').disabled=false;$('#sRead').textContent='Read angle';$('#sMsg').textContent='';
  $('#sMode').textContent=S.settings.mode==='cam'?'Use top edge':'Use camera';
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')$('#sMsg').textContent='Motion access was refused. Allow it in Settings, or type the angle by hand.'}}catch(e){}
  sens.buf=[];sens.got=false;sens.abs=false;addEventListener('deviceorientation',onOri);
  setTimeout(()=>{if(sightOpen&&!sens.got){sens.abs=true;addEventListener('deviceorientationabsolute',onOri);
    setTimeout(()=>{if(sightOpen&&!sens.got)$('#sMsg').textContent='No reading from the tilt sensor. The page must be on HTTPS, and some phones lack the sensor. You can type the angle by hand.'},1800)}},1500);
  startCam();
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
  cancelAnimationFrame(raf);loop();
}
function closeSight(){
  sightOpen=false;cap=null;removeEventListener('deviceorientation',onOri);removeEventListener('deviceorientationabsolute',onOri);
  stopCam();try{wake&&wake.release()}catch(e){}wake=null;cancelAnimationFrame(raf);
  $('#sight').hidden=true;document.body.classList.remove('noscroll');

const EDGE_TXT='Top-edge sighting: hold the phone with the screen facing you and the top edge pointing at the target. Look along the top edge to the target mark, then tap Read.';
async function startCam(){
  const v=$('#cam'),nc=$('#nocam');
  $('#xh').hidden=S.settings.mode!=='cam';$('#sZoom').hidden=S.settings.mode!=='cam';
  if(S.settings.mode!=='cam'){stopCam();v.hidden=true;nc.hidden=false;nc.textContent=EDGE_TXT;return}
  if(stream){v.hidden=false;nc.hidden=true;return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){v.hidden=true;nc.hidden=false;nc.textContent='The camera is not available here (the page needs HTTPS). Switch to top-edge sighting, or type the angle by hand.';return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!sightOpen||S.settings.mode!=='cam'){s.getTracks().forEach(t=>t.stop());return}
    stream=s;v.srcObject=s;v.hidden=false;nc.hidden=true;v.play().catch(()=>{});setZoom(zoom);
  }catch(e){v.hidden=true;nc.hidden=false;nc.textContent='The camera could not start ('+(e.name||'error')+'). Allow camera access for this page, or switch to top-edge sighting.'}
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const v=$('#cam');v.srcObject=null}
function setZoom(z){zoom=z;$('#cam').style.transform=`scale(${z})`;document.querySelectorAll('#sZoom button').forEach(b=>b.classList.toggle('on',+b.dataset.z===z))}
function loop(){
  raf=requestAnimationFrame(loop);
  const now=performance.now();const rec=sens.buf.filter(x=>now-x.t<1000);if(!rec.length)return;
  const last=sens.buf.filter(x=>now-x.t<300);const raw=mean((last.length?last:rec).map(x=>x.v));const sd=std(rec.map(x=>x.v));

  if(!cap&&!sRes)$('#sAng').textContent=fmtAng(shown);
  $('#sRaw').textContent=sOpt.raw?'raw sensor angle':`raw ${fmtAng(raw)} · offset ${fmtAng(calNow())}`;
  const q=Math.max(0,Math.min(1,1-sd/0.4));const bar=$('#sStab');bar.style.width=(q*100).toFixed(0)+'%';
  bar.style.background=sd<0.05?'#4CC27F':sd<0.15?'#E0A43A':'#F06C5E';

}
function sightRead(){

function sightDone(){
  if(!cap)return;const b=cap.buf;cap=null;$('#sRead').disabled=false;$('#sRead').textContent='Read angle';
  if(b.length<8){$('#sMsg').textContent='Too few sensor readings. Try again.';return}

  sRes={raw,sd,n:b.length,ang,cal:c,mode:S.settings.mode};
  const d=num(sOpt.d);const sig=Math.sqrt(sd*sd+S.settings.sigma**2)*D2R;

  r.innerHTML=`<div class="big">${fmtAng(sOpt.raw?raw:ang)}</div><div style="font-size:14px;color:#C9D3D8">${b.length} readings, spread ${sd.toFixed(2)}°${sd>0.2?' · unsteady, read again for a better result':''}${Number.isFinite(d)&&d>0&&!sOpt.raw?` · about ${cm(d*sig/Math.cos(ang*D2R)**2)} at ${f(d,1)} m`:''}</div>

}

    if(el.dataset.next){draft=null;const k=stack.pop();stack.push({v:'point',s:k.s,l:k.l});S.stack=stack;render();window.scrollTo(0,0);toast('Saved '+clean.label)}
    else uiBack()},
  'del-p':()=>{const n=cur(),s=getS(n.s),l=s.lines.find(x=>x.id===n.l);const p=draft;
    if(l.pts.some(q=>q.st===p.id)){toast('Other points were sighted from this one. Delete or move those first.');return}
    if(!confirm('Delete '+p.label+'?'))return;l.pts=l.pts.filter(q=>q.id!==p.id);if(l.setup===p.id)l.setup=l.pts[0].id;save();uiBack()},
  'gps-l':()=>{const n=cur(),l=getS(n.s).lines.find(x=>x.id===n.l);startGps(g=>{l.gps=g;save();render();toast('Location saved ±'+Math.round(g.acc)+' m')})},
  'gps-p':()=>startGps(g=>{draft.gps=g;render();toast('Location captured ±'+Math.round(g.acc)+' m. Save the point to keep it.')}),
  'gps-ok':()=>stopGps(true),'gps-x':()=>stopGps(false),
  cal:()=>{calD={t1:null,t2:null};go({v:'cal'})},
  help:()=>go({v:'help'}),
  'cal-mode':el=>{S.settings.mode=el.dataset.v;calD={t1:null,t2:null};save();render()},
  'cal-read':el=>{const k=el.dataset.k;openSight({raw:true,hint:k==='t1'?'Step 1: at pole A, aim at the mark on pole B':'Step 2: at pole B, aim at the mark on pole A',onDone:r=>{calD[k]=r;render()}})},
  'cal-save':()=>{const st=S.settings,m=st.mode;const c=(calD.t1.raw+calD.t2.raw)/2,sl=(calD.t1.raw-calD.t2.raw)/2;st.cal[m]=c;st.calDate[m]=today();(st.calLog=st.calLog||[]).push({mode:m,date:today(),c,sl});save();calD={t1:null,t2:null};render();toast('Offset saved: '+fmtAng(c))},
  'save-sig':()=>{const v=num($('#fSig').value);if(v>0&&v<5){S.settings.sigma=v;save();toast('Updated')}else toast('Enter a value between 0 and 5')},
  exp:()=>go({v:'exp',s:cur().s}),
  'x-sum':()=>{const s=getS(cur().s);download(new Blob([toCSV(sumRows(s))],{type:'text/csv'}),base(s)+'_summary.csv')},
  'x-pts':()=>{const s=getS(cur().s);download(new Blob([toCSV(ptRows(s))],{type:'text/csv'}),base(s)+'_points.csv')},
  'x-png-banks':()=>{const s=getS(cur().s);const sv=plotBanks(summary(s),LIGHT,`${s.nala}, ${s.village}: bank heights above bed`);if(sv)svgToPng(sv,base(s)+'_bank_heights.png');else toast('No sections with both banks yet')},
  'x-png-ls':()=>{const s=getS(cur().s);svgToPng(plotLS(s,LIGHT,`${s.nala}, ${s.village}: L-section`),base(s)+'_L-section.png')},
  'x-png-all':()=>{const s=getS(cur().s);let k=0;s.lines.filter(l=>l.type==='CS').forEach(l=>{const sv=plotCS(lineResults(s,l),LIGHT,`${s.nala}, ${s.village}: ${l.name} at ch ${f(l.ch,1)} m`);if(sv){setTimeout(()=>svgToPng(sv,base(s)+'_'+l.name.replace(/\W+/g,'')+'.png'),k*700);k++}});if(!k)toast('No drawings yet')},
  'png-l':()=>{const n=cur(),s=getS(n.s),l=s.lines.find(x=>x.id===n.l);const sv=l.type==='CS'?plotCS(lineResults(s,l),LIGHT,`${s.nala}, ${s.village}: ${l.name} at ch ${f(l.ch,1)} m`):plotLS(s,LIGHT,`${s.nala}, ${s.village}: ${l.name}`);if(sv)svgToPng(sv,base(s)+'_'+l.name.replace(/\W+/g,'')+'.png');else toast('Not enough points to draw yet')},
  'x-kml':()=>{const s=getS(cur().s);download(new Blob([kml(s)],{type:'application/vnd.google-earth.kml+xml'}),base(s)+'.kml')},
  'x-json':()=>{const s=getS(cur().s);download(new Blob([JSON.stringify({app:'nala-phone-level',v:1,surveys:[s]},null,1)],{type:'application/json'}),base(s)+'_backup.json')},
  'x-share':()=>{const s=getS(cur().s);navigator.share({title:s.nala,text:shareText(s)}).catch(()=>{})},
  imp:()=>$('#impFile').click(),
  zoom:el=>setZoom(+el.dataset.z),
  's-mode':()=>{S.settings.mode=S.settings.mode==='cam'?'edge':'cam';save();$('#sMode').textContent=S.settings.mode==='cam'?'Use top edge':'Use camera';sens.buf=[];startCam();if(!sOpt.raw&&!S.settings.calDate[S.settings.mode])$('#sMsg').textContent='This sighting method is not calibrated yet.'},
  's-cancel':()=>history.back(),
  's-read':()=>sightRead(),
  's-again':()=>{sRes=null;$('#sRes').hidden=true;$('#sAct').hidden=false},
  's-use':()=>{const r=sRes,o=sOpt;history.back();if(r&&o&&o.onDone)setTimeout(()=>o.onDone(r),30)},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el)}});
document.addEventListener('input',e=>{const el=e.target;if(!draft||!el.dataset||!el.dataset.f)return;const k=el.dataset.f;
  if(el.type==='checkbox'){draft[k]=el.checked;return}
  draft[k]=el.value;
  if(k==='aTxt'){const v=num(el.value);draft.ang=v;draft.raw=null;draft.sd=null;draft.n=0;draft.cal=0;const pa=$('#pAng');if(pa)pa.textContent=fmtAng(v);schedule()}
  if(k==='dTxt'||k==='hi'||k==='ht')schedule()});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='selSetup'){const n=cur(),l=getS(n.s).lines.find(x=>x.id===n.l);l.setup=el.value;save();render();toast('Instrument moved')}
  else if(el.id==='pSt'&&draft){draft.st=el.value;render()}
  else if(el.dataset&&el.dataset.f==='hi'&&draft){const v=num(el.value);
    // keep the target mark at the same height as the instrument unless it was set differently
    if(Number.isFinite(v)&&num(draft.ht)===num(draft._prevHi)){draft.ht=v;const t=document.querySelector('[data-f="ht"]');if(t)t.value=v}
    if(Number.isFinite(v))draft._prevHi=v;schedule()}});
let sch=0;function schedule(){clearTimeout(sch);sch=setTimeout(()=>{const n=cur();if(n.v!=='point'||!draft)return;const s=getS(n.s),l=s&&s.lines.find(x=>x.id===n.l);const box=$('#pPrev');if(l&&box)box.innerHTML=previewHtml(s,l,draft)},250)}
$('#impFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);const list=o.surveys||(o.lines?[o]:[]);if(!list.length)throw 0;let k=0;
    list.forEach(s=>{if(!s.lines)return;if(S.surveys.some(x=>x.id===s.id))s.id=uid();S.surveys.push(s);k++});save();render();toast(`Restored ${k} survey${k===1?'':'s'}`)}catch(err){toast('This file is not a Nala Phone Level backup')}
    e.target.value=''};rd.readAsText(file)});
history.replaceState({n:0},'');
render();
// offline use: cache the app on the phone after the first visit
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
